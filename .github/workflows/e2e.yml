name: E2E

on:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch: # manual trigger from GitHub UI

concurrency:
  group: e2e
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  AUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  NEXTAUTH_URL: http://localhost:3000
  UNITELLER_MODE: test
  ESKIZ_SENDER: BIGMAX
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ci_stub_bot
  DATABASE_URL: postgresql://bigmax:bigmax@localhost:5432/bigmax_e2e
  REDIS_URL: redis://localhost:6379

jobs:
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bigmax
          POSTGRES_PASSWORD: bigmax
          POSTGRES_DB: bigmax_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigmax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          touch .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "REDIS_URL=$REDIS_URL" >> .env

      - name: Apply DB migrations
        run: pnpm --filter @bigmax/db exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm --filter @bigmax/db exec prisma generate

      - name: Seed test data
        run: pnpm --filter @bigmax/db run db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @bigmax/web exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm --filter @bigmax/web run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
