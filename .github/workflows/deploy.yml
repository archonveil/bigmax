name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never cancel a running deploy — let it finish, then run the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Keep connection alive during long docker builds (Next.js ~5-10 min).
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync code to server
        run: |
          rsync -az --delete \
            -e "ssh -F ~/.ssh/config" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='.env*' \
            --exclude='**/.next' \
            --exclude='**/dist' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/bigmax/

      - name: Rebuild and restart
        timeout-minutes: 15
        run: |
          ssh -F ~/.ssh/config \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/bigmax && \
             docker compose -f docker-compose.prod.yml up -d --build web worker && \
             sleep 5 && \
             docker compose -f docker-compose.prod.yml ps && \
             docker compose -f docker-compose.prod.yml logs --tail=10 web"
