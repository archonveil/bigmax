name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never cancel a running deploy — let it finish, then run the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Job 1: build images in CI (fast CPU + GHA layer cache) ─────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://domtextile.uz
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=bigmax_shop_bot
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Migrate image = web builder stage (has pnpm + prisma CLI).
      # Shares layer cache with web — only the final COPY differs.
      - name: Build & push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: builder
          push: true
          tags: ghcr.io/${{ github.repository }}/migrate:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  # ── Job 2: pull on server & restart (~30 sec, no build) ─────────────
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/deploy_key\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Pull & restart
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd /opt/bigmax
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin
             docker compose -f docker-compose.prod.yml pull web worker
             docker compose -f docker-compose.prod.yml up -d web worker
             sleep 5
             docker compose -f docker-compose.prod.yml ps
             docker compose -f docker-compose.prod.yml logs --tail=10 web"
