name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны при быстрых follow-up пушах.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  AUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  NEXTAUTH_URL: http://localhost:3000
  UNITELLER_MODE: test
  ESKIZ_SENDER: BIGMAX
  # NEXT_PUBLIC_* baked into the bundle at build time.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ci_stub_bot
  # DATABASE_URL and REDIS_URL are intentionally NOT set here.
  # Worker integration/BullMQ tests use describe.skipIf(!DATABASE_URL) —
  # if these are set but services aren't running the tests fail with ECONNREFUSED.
  # They are only set in the e2e job which has real postgres/redis services.

jobs:
  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bigmax/db exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Translation keys in sync
        run: pnpm run check:i18n

      - name: Unit tests
        run: pnpm run test

      - name: Build apps/web
        run: pnpm --filter @bigmax/web run build

  # P7-T2 sub-task N: e2e через Playwright поверх реального Postgres + Redis.
  # Запускается ПОСЛЕ `ci` job'а (unit-check'и должны зелёные пройти первыми),
  # параллельная экономия — нет смысла гонять e2e на коде, который и тайпчек
  # не прошёл. Service containers поднимают DB + Redis, степ `migrate deploy`
  # применяет все миграции включая seed-row'ы для features (P7-T2 F+L).
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bigmax
          POSTGRES_PASSWORD: bigmax
          POSTGRES_DB: bigmax_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigmax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://bigmax:bigmax@localhost:5432/bigmax_e2e
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env (для dotenv-cli scripts)
        # Seed-script и playwright `webServer.command: pnpm dev` обёрнуты в
        # `dotenv -e ../../.env -- …` — этому надо физический файл. В CI всё
        # уже в process.env, поэтому достаточно пустого .env (env vars
        # GitHub Actions имеют приоритет).
        run: |
          touch .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "REDIS_URL=$REDIS_URL" >> .env

      - name: Apply DB migrations
        # `migrate deploy` применяет все migrations/*/migration.sql, включая
        # `20260511220000_features_table` (seed loyalty.earn_percent) и
        # `20260511230000_feature_loyalty_spend_enabled` (sub-task L row).
        run: pnpm --filter @bigmax/db exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm --filter @bigmax/db exec prisma generate

      - name: Seed test data
        # Catalog/product e2e tests ссылаются на seed-products. P7-T2 feature
        # rows уже в БД (созданы миграциями), seed их не трогает.
        run: pnpm --filter @bigmax/db run db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @bigmax/web exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm --filter @bigmax/web run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
