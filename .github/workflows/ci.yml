name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRs: cancel stale runs on new push.
# Main: never cancel — don't interrupt a running deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  AUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  NEXTAUTH_URL: http://localhost:3000
  UNITELLER_MODE: test
  ESKIZ_SENDER: BIGMAX
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ci_stub_bot

jobs:
  # ── Checks ─────────────────────────────────────────────────────────
  checks:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bigmax/db exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Translation keys in sync
        run: pnpm run check:i18n

      - name: Unit tests
        run: pnpm run test

  # ── Build web image, pipe to server (parallel with worker) ─────────
  #
  # The server cannot pull from ghcr.io (outbound HTTPS blocked by VPS
  # network). Instead we: build the image on the GHA runner using the
  # GHA layer cache, then stream it directly to the server over the
  # already-open SSH tunnel with docker save | gzip | docker load.
  # No registry login required on the server side.
  build-web:
    name: Build & ship web image
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://domtextile.uz
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=bigmax_shop_bot
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transfer web image to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          docker save ghcr.io/${{ github.repository }}/web:latest \
            | gzip \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "gunzip | docker load"

  # ── Build worker image, pipe to server (parallel with web) ─────────
  build-worker:
    name: Build & ship worker image
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transfer worker image to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          docker save ghcr.io/${{ github.repository }}/worker:latest \
            | gzip \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "gunzip | docker load"

  # ── Deploy: restart services with the loaded images ─────────────────
  deploy:
    name: Deploy to production
    needs: [build-web, build-worker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync compose and Caddyfile to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp docker-compose.prod.yml Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/bigmax/"

      - name: Restart services
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd /opt/bigmax
            docker compose -f docker-compose.prod.yml up -d web worker caddy
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=20 web
          "
