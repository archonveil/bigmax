name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны при быстрых follow-up пушах.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  AUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-dummy-secret-not-used-outside-ci-at-least-32ch
  NEXTAUTH_URL: http://localhost:3000
  UNITELLER_MODE: test
  ESKIZ_SENDER: BIGMAX
  # NEXT_PUBLIC_* baked into the bundle at build time.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ci_stub_bot
  # DATABASE_URL and REDIS_URL are intentionally NOT set here.
  # Worker integration/BullMQ tests use describe.skipIf(!DATABASE_URL) —
  # if these are set but services aren't running the tests fail with ECONNREFUSED.
  # They are only set in the e2e job which has real postgres/redis services.

jobs:
  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bigmax/db exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Translation keys in sync
        run: pnpm run check:i18n

      - name: Unit tests
        run: pnpm run test

      - name: Build apps/web
        run: pnpm --filter @bigmax/web run build
