# =====================================================================
# Бигмах (domtextile.uz) — production stack.
#
# Images are built in GitHub Actions and pushed to GHCR.
# Server only pulls and restarts — no local docker build needed.
#
# Первый запуск / смена образов:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Логи:
#   docker compose -f docker-compose.prod.yml logs -f web
# =====================================================================

name: domtextile-prod

services:
  # ----- PostgreSQL 16 -----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bigmax}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigmax} -d ${POSTGRES_DB:-bigmax}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----- Redis 7 -----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----- Migrate (one-off, gates web+worker start) -----
  migrate:
    image: ghcr.io/archonveil/bigmax/migrate:latest
    restart: "no"
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bigmax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bigmax}"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        echo "Running prisma migrate deploy..."
        pnpm --filter @bigmax/db exec prisma migrate deploy --schema=prisma/schema.prisma
        echo "Migrations complete."

  # ----- Web (Next.js standalone) -----
  web:
    image: ghcr.io/archonveil/bigmax/web:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bigmax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bigmax}"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    volumes:
      - uploads-data:/app/apps/web/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ----- Worker (BullMQ) -----
  worker:
    image: ghcr.io/archonveil/bigmax/worker:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bigmax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bigmax}"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ----- Caddy (TLS reverse proxy) -----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-domtextile.uz}

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  caddy-data:
  caddy-config:
